version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipmind-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=clipmind-ai-production-super-secret-key-2026
      - DATABASE_URL=sqlite+aiosqlite:///storage/clipmind.db
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clipmind-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
